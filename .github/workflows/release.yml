name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Verify tag matches package version
        run: |
          version="$(uv run python -c 'import simp_vmgen; print(simp_vmgen.__version__)')"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Run tests
        run: |
          set +e
          uv run pytest 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '## Pytest failure'
              echo '```'
              tail -200 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Report test failure
        if: failure()
        run: |
          if [ -f pytest.log ]; then
            tail -80 pytest.log | while IFS= read -r line; do
              echo "::error title=pytest::$line"
            done
          fi

      - name: Build distributions
        run: uv build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
