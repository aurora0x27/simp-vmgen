schema = 1

[project]
name = "golden-ubuntu"

[distro]
name = "ubuntu"
release = "24.04"
arch = "x86_64"

[vm]
mem = "4G"
cpus = 4
disk = "30G"
accel = "auto"
display = "none"

[ssh]
enabled = true
host = "127.0.0.1"
port = "auto"
user = "alice"
permit_root_login = true
wait_timeout = 900
key = ".simp-vmgen/ssh/id_ed25519"

[gdb]
enabled = false
port = "auto"
wait = false

[[mount]]
source = "work"
target = "/work"

[[mount]]
source = "src"
target = "/src"
readonly = true

[[users]]
name = "root"
password = "root-secret"

[[users]]
name = "alice"
password = "alice-secret"
shell = "bash"
sudo = true
groups = [
    "docker",
]
ssh_keys = [
    "ssh-ed25519 AAAA alice",
]

[provision]
timezone = "Asia/Shanghai"
package_sets = [
    "base",
    "dev",
]
extra_packages = [
    "zsh",
]

[kernel]
enabled = false
mode = "build"
config = "defconfig"
rootfs = "busybox"
