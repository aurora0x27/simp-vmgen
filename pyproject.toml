[project]
name = "simp-vmgen"
version = "0.2.0"
description = "Generate reproducible QEMU lab environments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "aurora0x27", email = "qingfengzl0831@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
]
dependencies = [
    "jinja2>=3.1",
    "shtab>=1.13.0",
    "tomli-w>=1.2",
]

[project.urls]
Homepage = "https://github.com/aurora0x27/simp-vmgen"
Repository = "https://github.com/aurora0x27/simp-vmgen"
Issues = "https://github.com/aurora0x27/simp-vmgen/issues"

[project.scripts]
simp-vmgen = "simp_vmgen.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-cov>=6",
    "pyyaml>=6",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: integration tests that boot QEMU (set SIMP_VMGEN_SLOW=1)",
    "install: uv tool install smoke tests (set SIMP_VMGEN_INSTALL_TEST=1)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
