[project]
name = "simp-vmgen"
version = "0.1.0"
description = "Generate reproducible QEMU lab environments"
readme = "README.md"
authors = [
    { name = "aurora0x27", email = "qingfengzl0831@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "tomli-w>=1.2",
]

[project.scripts]
simp-vmgen = "simp_vmgen.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-cov>=6",
    "pyyaml>=6",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
